<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e6fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6fb0ff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="160" cy="160" r="90" />
    </clipPath>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#g)" />

  <!-- subtle pattern -->
  <g fill-opacity="0.08">
    <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  </g>

  <!-- Avatar -->
  <g transform="translate(80,140)">
    <rect x="0" y="0" width="200" height="200" rx="24" fill="#ffffff"/>
    <image href="/avatar.png" x="0" y="0" width="200" height="200" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Logo and text -->
  <g transform="translate(320,170)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="800" font-size="56" fill="#ffffff">Azynar<span fill="#0a0a0a">.</span></text>
    <text x="0" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="600" font-size="28" fill="#ffffff">AI-Powered Developer & Technical Writer</text>

    <text x="0" y="130" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="500" font-size="22" fill="#ffffff">I build it. I automate it. I document it.</text>
  </g>

  <!-- Tagline block -->
  <g transform="translate(320,240)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="44" fill="#ffffff">I Help Startups Build Faster,</text>
    <text x="0" y="54" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="44" fill="#ffffff">Automate Smarter, and Document Clearly.</text>
  </g>

  <!-- Small corner note -->
  <text x="32" y="600" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="14" fill="#ffffff">azynardev.vercel.app</text>
</svg>
